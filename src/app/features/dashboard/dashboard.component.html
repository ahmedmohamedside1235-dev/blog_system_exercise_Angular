<div class="container mt-5">
  <div class="head d-flex align-items-center justify-content-between w-100 mb-5">
    <div class="info">
      <h3 class="mb-2">Dashboard</h3>
      <p class="mb-0">Manage your posts</p>
    </div>
    <div class="add_post">
      <button class="btn add_anchor" data-bs-toggle="modal" data-bs-target="#AddPost">
        + New Post
      </button>
    </div>
  </div>

  <div class="mt-5">
    <app-posts [isTrashed]="true"></app-posts>
  </div>
</div>
